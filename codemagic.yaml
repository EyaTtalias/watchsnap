workflows:
  ios-app-store:
    name: WatchSnap iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.watchsnap.app
      vars:
        BUNDLE_ID: com.watchsnap.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.0.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: |
          export BUILD_TARGET=capacitor
          npm run build
          npx cap sync ios
      - name: Increment build number
        script: |
          # Use Codemagic's sequential $BUILD_NUMBER so every upload to
          # App Store Connect has a unique CFBundleVersion.
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
