workflows:

  ios-app-store:
    name: WatchSnap iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic   # App Store Connect API key configured in Codemagic UI

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.watchsnap.app
      vars:
        BUNDLE_ID: com.watchsnap.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20.11.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $FCI_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:

      # ── 1. Install JS dependencies ──────────────────────────────────
      - name: Install Node dependencies
        script: npm ci

      # ── 2. Build Next.js (static export for Capacitor) ──────────────
      - name: Build Next.js app
        script: |
          export BUILD_TARGET=capacitor
          npm run build

      # ── 3. Install CocoaPods ─────────────────────────────────────────
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      # ── 4. Sync Capacitor → iOS ──────────────────────────────────────
      - name: Capacitor sync
        script: npx cap sync ios

      # ── 5. Set bundle version from Codemagic build number ───────────
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
        working_directory: ios/App

      # ── 6. Build & archive for App Store ────────────────────────────
      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme  "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration          # uses the App Store Connect API key above
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false  # set to true when ready for production release

      email:
        recipients:
          - eyaltalias@gmail.com
        notify:
          success: true
          failure: true
