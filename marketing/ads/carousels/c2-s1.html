<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 2 · Slide 1 — Sarah's Grandpa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #0C0905; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 30% 60%, rgba(251,146,60,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 75% 25%, rgba(212,175,55,0.05) 0%, transparent 65%),
      #0C0905;
  }
  /* Warm dust particles */
  .dust {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(251,146,60,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 35%, rgba(0,0,0,0.72) 100%); }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; padding: 52px 68px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 8px rgba(212,175,55,0.5); }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; letter-spacing: 1px; }

  /* Memory tag */
  .memory-tag {
    display: inline-flex; align-items: center; gap: 9px;
    background: rgba(251,146,60,0.07); border: 1px solid rgba(251,146,60,0.18);
    border-radius: 30px; padding: 8px 18px;
    font-size: 15px; color: #fb923c;
    margin-bottom: 52px;
  }

  /* Vintage watch illustration */
  .watch-vintage {
    width: 120px; height: 120px; position: relative; margin-bottom: 44px;
  }
  .wv-bezel {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, #3a3020, #1a1408, #2a2010);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6), 0 0 20px rgba(251,146,60,0.12);
    position: relative;
  }
  .wv-face {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #d4c08a 0%, #a89040 40%, #6a5820 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .wv-face::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 62% 30%, rgba(255,255,255,0.14) 0%, transparent 50%); }
  .wv-center { width: 7px; height: 7px; background: #1a1000; border-radius: 50%; }
  .wv-scratch {
    position: absolute; width: 2px; height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06), transparent);
    top: 10px; left: 60%; transform: rotate(-20deg);
  }

  .story-text { font-size: 46px; font-weight: 900; color: #fff; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 28px; max-width: 860px; }
  .story-text .em { color: #fb923c; }

  .sub-text { font-size: 22px; color: #666; line-height: 1.55; max-width: 700px; font-weight: 400; }
  .sub-text em { color: #D4AF37; font-style: normal; }

  .person-tag { margin-top: auto; display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .person-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #dc2626); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .person-name { font-size: 17px; font-weight: 700; color: #fff; }
  .person-loc { font-size: 14px; color: #555; margin-top: 2px; }

  .dots { display: flex; gap: 10px; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #1A1A1A; }
  .dot.active { background: #fb923c; }

  /* Decorative quote marks */
  .big-quote { position: absolute; right: 68px; top: 160px; font-size: 200px; color: rgba(251,146,60,0.05); font-family: Georgia, serif; line-height: 1; pointer-events: none; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="dust"></div>
<div class="vignette"></div>
<div class="big-quote">"</div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">1 OF 4</div>
  </div>

  <div class="memory-tag">🕯️ In Memory of Grandpa Harold · Chicago, IL</div>

  <div class="watch-vintage">
    <div class="wv-bezel">
      <div class="wv-face">
        <div class="wv-scratch"></div>
        <div class="wv-center"></div>
      </div>
    </div>
  </div>

  <div class="story-text">
    "My grandpa passed<br>
    last year. We found<br>
    his <span class="em">old watch</span>."
  </div>

  <div class="sub-text">
    Scratched up. No box, no papers.<br>
    He wore it <em>every single day</em> for decades.
  </div>

  <div class="person-tag">
    <div class="person-avatar">S</div>
    <div>
      <div class="person-name">Sarah Thompson</div>
      <div class="person-loc">Chicago, IL</div>
    </div>
  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
