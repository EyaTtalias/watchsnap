<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 1 · Slide 2 — Scanning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #080C10; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 60% at 50% 45%, rgba(59,130,246,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(212,175,55,0.05) 0%, transparent 70%),
      #080C10;
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 30%, rgba(0,0,0,0.7) 100%); }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; align-items: center; padding: 52px 68px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 48px; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; letter-spacing: 1px; }

  /* Phone mockup with WatchSnap UI */
  .phone-wrap {
    position: relative;
    width: 320px; height: 420px;
    margin-bottom: 44px;
  }
  .phone-frame {
    width: 320px; height: 420px;
    background: #111;
    border: 2px solid #2A2A2A;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px #333;
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 80px; height: 6px; background: #222; border-radius: 3px; z-index: 10;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: #0A0A0A;
    display: flex; flex-direction: column;
    align-items: center; padding: 32px 20px 20px;
  }
  .app-header { font-size: 12px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; margin-bottom: 16px; }

  /* Camera viewfinder */
  .viewfinder {
    width: 240px; height: 200px;
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    position: relative;
    background: rgba(212,175,55,0.03);
    margin-bottom: 14px;
    overflow: hidden;
  }
  /* Corner brackets */
  .corner { position: absolute; width: 20px; height: 20px; }
  .corner.tl { top: -1px; left: -1px; border-top: 3px solid #D4AF37; border-left: 3px solid #D4AF37; border-radius: 2px 0 0 0; }
  .corner.tr { top: -1px; right: -1px; border-top: 3px solid #D4AF37; border-right: 3px solid #D4AF37; border-radius: 0 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom: 3px solid #D4AF37; border-left: 3px solid #D4AF37; border-radius: 0 0 0 2px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom: 3px solid #D4AF37; border-right: 3px solid #D4AF37; border-radius: 0 0 2px 0; }
  /* Scan line */
  .scan-line {
    position: absolute; left: 10px; right: 10px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    top: 40%;
    box-shadow: 0 0 8px rgba(212,175,55,0.8);
  }
  /* Watch silhouette inside viewfinder */
  .watch-silhouette {
    position: absolute; inset: 20px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.2);
    display: flex; align-items: center; justify-content: center;
  }
  .watch-inner-s { width: 80px; height: 80px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.15); background: rgba(212,175,55,0.03); }

  /* Progress bar */
  .progress-wrap { width: 100%; margin-bottom: 10px; }
  .progress-label { font-size: 10px; color: #555; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-label span { color: #D4AF37; }
  .progress-track { height: 4px; background: #1E1E1E; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 68%; background: linear-gradient(90deg, #D4AF37, #F0CC5A); border-radius: 2px; }

  /* Analysis steps */
  .steps { width: 100%; }
  .step { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .step-check { width: 14px; height: 14px; border-radius: 50%; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-check-pending { width: 14px; height: 14px; border-radius: 50%; background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.3); flex-shrink: 0; }
  .step-text { font-size: 10px; color: #666; }
  .step-text.done { color: #4ade80; }
  .step-text.active { color: #D4AF37; }

  /* Phone glow */
  .phone-glow {
    position: absolute; inset: -20px;
    background: radial-gradient(ellipse, rgba(212,175,55,0.12) 0%, transparent 70%);
    z-index: -1;
  }

  /* Text section */
  .text-section { width: 100%; text-align: center; }
  .tension-text { font-size: 38px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 14px; }
  .tension-sub { font-size: 20px; color: #555; }
  .tension-sub em { color: #D4AF37; font-style: normal; font-weight: 700; }

  .bottom-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #1A1A1A; }
  .dot.done { background: rgba(212,175,55,0.4); }
  .dot.active { background: #D4AF37; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">2 OF 4</div>
  </div>

  <!-- Phone mockup -->
  <div class="phone-wrap">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-header">WATCHSNAP AI</div>
        <div class="viewfinder">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <div class="scan-line"></div>
          <div class="watch-silhouette"><div class="watch-inner-s"></div></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-label">Analyzing watch... <span>68%</span></div>
          <div class="progress-track"><div class="progress-fill"></div></div>
        </div>
        <div class="steps">
          <div class="step"><div class="step-check"><svg width="8" height="8" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#4ade80" stroke-width="2" fill="none"/></svg></div><div class="step-text done">Brand identified</div></div>
          <div class="step"><div class="step-check"><svg width="8" height="8" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#4ade80" stroke-width="2" fill="none"/></svg></div><div class="step-text done">Model matched</div></div>
          <div class="step"><div class="step-check-pending"></div><div class="step-text active">Authentication check...</div></div>
          <div class="step"><div class="step-check-pending"></div><div class="step-text">Market valuation</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-section">
    <div class="tension-text">
      "Something felt different.<br>I ran it through WatchSnap."
    </div>
    <div class="tension-sub">
      Results in <em>under 15 seconds</em>...
    </div>
  </div>

  <div class="bottom-row">
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>
</body>
</html>
