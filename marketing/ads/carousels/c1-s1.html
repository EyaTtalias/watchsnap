<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 1 · Slide 1 — Mike's Market</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #0A0A0A; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  /* Gritty Brooklyn atmosphere */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 80%, rgba(212,175,55,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,255,255,0.02) 0%, transparent 60%),
      #0A0A0A;
  }
  /* Subtle grid lines — market stall feel */
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
  }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; padding: 52px 68px; }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; letter-spacing: 1px; }

  /* ── Location tag ── */
  .location-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px; padding: 7px 16px;
    font-size: 14px; color: #777;
    margin-top: 42px; margin-bottom: 52px;
  }
  .loc-dot { width: 6px; height: 6px; background: #D4AF37; border-radius: 50%; }

  /* ── Main quote ── */
  .quote-mark { font-size: 120px; color: #D4AF37; line-height: 0.6; margin-bottom: 18px; opacity: 0.4; font-family: Georgia, serif; }

  .main-text {
    font-size: 52px; font-weight: 900; color: #fff;
    line-height: 1.15; letter-spacing: -1px;
    margin-bottom: 32px; max-width: 900px;
  }
  .main-text .price { color: #D4AF37; }
  .main-text .place { color: #aaa; font-weight: 500; font-size: 46px; }

  .sub-text { font-size: 24px; color: #666; font-weight: 400; line-height: 1.5; max-width: 700px; }

  /* ── Person tag ── */
  .person-tag {
    margin-top: auto;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 28px;
  }
  .person-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #D4AF37, #B8922A);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #000;
    flex-shrink: 0;
  }
  .person-name { font-size: 17px; font-weight: 700; color: #fff; }
  .person-loc { font-size: 14px; color: #555; margin-top: 2px; }

  /* ── Slide dots ── */
  .dots { display: flex; gap: 10px; margin-bottom: 0; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #222; }
  .dot.active { background: #D4AF37; }
  .dot.dim { background: #1A1A1A; }

  /* Side decoration */
  .side-line {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, transparent, #D4AF37, transparent);
    opacity: 0.3;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>
<div class="vignette"></div>
<div class="side-line"></div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">1 OF 4</div>
  </div>

  <div class="location-tag">
    <div class="loc-dot"></div>
    Brooklyn Flea Market · Sunday morning
  </div>

  <div class="quote-mark">"</div>

  <div class="main-text">
    I found a watch<br>
    for <span class="price">$15</span> at a<br>
    <span class="place">flea market.</span>
  </div>

  <div class="sub-text">
    Something felt different about it.<br>
    The weight. The dial. I couldn't explain it.
  </div>

  <div class="person-tag">
    <div class="person-avatar">M</div>
    <div>
      <div class="person-name">Mike Callahan</div>
      <div class="person-loc">Brooklyn, NY · Watch collector</div>
    </div>
  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
