<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 5 · Slide 1 — Tyler's Dad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #09090C; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 70% 40%, rgba(99,90,200,0.06) 0%, transparent 65%),
      radial-gradient(ellipse 45% 40% at 25% 70%, rgba(212,175,55,0.05) 0%, transparent 60%),
      #09090C;
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 88% 88% at 50% 50%, transparent 30%, rgba(0,0,0,0.72) 100%); }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; padding: 52px 68px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; }

  /* Tag */
  .memorial-tag {
    display: inline-flex; align-items: center; gap: 9px;
    background: rgba(99,90,200,0.07); border: 1px solid rgba(99,90,200,0.18);
    border-radius: 30px; padding: 8px 18px;
    font-size: 15px; color: #a78bfa;
    margin-bottom: 44px;
  }

  /* IWC watch illustration */
  .watch-wrap { position: relative; width: 150px; height: 150px; margin-bottom: 40px; }
  .watch-glow { position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,250,0.12) 0%, transparent 68%); }
  .watch-case {
    width: 150px; height: 150px; border-radius: 50%;
    background: linear-gradient(135deg, #3a3a44, #1a1a22, #2a2a32);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px #111, 0 0 0 5px #252530, 0 6px 24px rgba(0,0,0,0.7);
    position: relative; z-index: 1;
  }
  .watch-dial {
    width: 122px; height: 122px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #f5f0e0 0%, #e0d8c0 45%, #c0b898 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .watch-dial::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 64% 30%, rgba(255,255,255,0.2) 0%, transparent 50%); }
  .wd-brand { font-size: 9px; font-weight: 900; color: #1a1a1a; letter-spacing: 2.5px; position: absolute; top: 26px; }
  .wd-city { font-size: 7px; color: #666; letter-spacing: 1px; position: absolute; top: 40px; }
  .wd-center { width: 7px; height: 7px; background: #1a1a1a; border-radius: 50%; z-index: 2; }
  .wd-h { position: absolute; bottom: 50%; left: calc(50% - 2px); width: 4px; height: 36px; background: #1a1a1a; border-radius: 2px; transform-origin: bottom center; transform: rotate(-35deg); }
  .wd-m { position: absolute; bottom: 50%; left: calc(50% - 1.5px); width: 3px; height: 46px; background: #1a1a1a; border-radius: 2px; transform-origin: bottom center; transform: rotate(60deg); }
  .wd-year { font-size: 8px; color: #666; font-weight: 700; position: absolute; bottom: 27px; }

  /* Story text */
  .story-text { font-size: 44px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 26px; max-width: 860px; letter-spacing: -0.5px; }
  .story-text .em { color: #a78bfa; font-style: italic; }
  .story-text .quote-mark { color: #444; }

  .sub-text { font-size: 22px; color: #666; line-height: 1.5; max-width: 700px; font-weight: 400; }
  .sub-text strong { color: #fff; }

  .person-tag { margin-top: auto; display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .person-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .person-name { font-size: 17px; font-weight: 700; color: #fff; }
  .person-loc { font-size: 14px; color: #555; margin-top: 2px; }

  .dots { display: flex; gap: 10px; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #1A1A1A; }
  .dot.active { background: #a78bfa; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">1 OF 3</div>
  </div>

  <div class="memorial-tag">🖤 Nashville, TN · Dad's watch</div>

  <div class="watch-wrap">
    <div class="watch-glow"></div>
    <div class="watch-case">
      <div class="watch-dial">
        <div class="wd-brand">IWC</div>
        <div class="wd-city">SCHAFFHAUSEN</div>
        <div class="wd-center"></div>
        <div class="wd-h"></div>
        <div class="wd-m"></div>
        <div class="wd-year">1989</div>
      </div>
    </div>
  </div>

  <div class="story-text">
    "Mom gave me dad's<br>
    watch. <span class="quote-mark">"</span><span class="em">Just an old thing,</span><span class="quote-mark">"</span><br>
    she said."
  </div>

  <div class="sub-text">
    After he passed. An old watch in a box.<br>
    She'd had it for <strong>30 years</strong> and never thought twice.
  </div>

  <div class="person-tag">
    <div class="person-avatar">T</div>
    <div>
      <div class="person-name">Tyler Reed</div>
      <div class="person-loc">Nashville, TN</div>
    </div>
  </div>

  <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body>
</html>
