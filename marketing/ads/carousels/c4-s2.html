<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 4 · Slide 2 — ROI Stats</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #090909; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 50% at 50% 50%, rgba(212,175,55,0.07) 0%, transparent 65%), #090909; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 88% 88% at 50% 50%, transparent 35%, rgba(0,0,0,0.65) 100%); }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; align-items: center; padding: 52px 68px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 48px; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; }

  .section-title { font-size: 16px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px; text-align: center; }

  /* Big stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; margin-bottom: 32px; }
  .stat-card {
    background: #131313; border: 1px solid #222;
    border-radius: 20px; padding: 28px 24px;
    text-align: center; position: relative; overflow: hidden;
  }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #D4AF37, transparent); }
  .stat-num {
    font-size: 56px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #D4AF37, #F0CC5A, #B8922A);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 16px; color: #777; font-weight: 500; }

  /* Price vs ROI */
  .price-roi-row {
    width: 100%;
    background: linear-gradient(135deg, rgba(212,175,55,0.07), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.22);
    border-radius: 18px; padding: 22px 30px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px;
  }
  .prr-left { }
  .prr-plan { font-size: 14px; color: #888; margin-bottom: 4px; }
  .prr-price { font-size: 36px; font-weight: 900; color: #D4AF37; }
  .prr-per { font-size: 16px; color: #666; }
  .prr-right { background: rgba(34,197,94,0.09); border: 1px solid rgba(34,197,94,0.24); border-radius: 14px; padding: 16px 22px; text-align: center; }
  .prr-roi-label { font-size: 12px; color: #4ade80; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .prr-roi-num { font-size: 32px; font-weight: 900; color: #4ade80; }

  /* Quote */
  .mini-quote { font-size: 24px; color: #888; font-style: italic; text-align: center; line-height: 1.5; }
  .mini-quote strong { color: #fff; font-style: normal; }

  .bottom-row { margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #1A1A1A; }
  .dot.done { background: rgba(212,175,55,0.4); }
  .dot.active { background: #D4AF37; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">2 OF 3</div>
  </div>

  <div class="section-title">Chris's results this year</div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num">2×</div><div class="stat-label">Fake buys avoided</div></div>
    <div class="stat-card"><div class="stat-num">~$900</div><div class="stat-label">Avg. loss per fake</div></div>
    <div class="stat-card"><div class="stat-num">&lt;12s</div><div class="stat-label">Avg. scan time</div></div>
    <div class="stat-card"><div class="stat-num">98%</div><div class="stat-label">AI accuracy rate</div></div>
  </div>

  <div class="price-roi-row">
    <div class="prr-left">
      <div class="prr-plan">WatchSnap Pro</div>
      <div><span class="prr-price">$9.99</span><span class="prr-per"> / month</span></div>
    </div>
    <div class="prr-right">
      <div class="prr-roi-label">Return on tool cost</div>
      <div class="prr-roi-num">90×</div>
    </div>
  </div>

  <div class="mini-quote">"The ROI isn't even a question.<br>It <strong>pays for itself on the first use.</strong>"</div>

  <div class="bottom-row">
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>
</body>
</html>
