<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel 2 · Slide 2 — Suspense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #080808; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 40% 50% at 50% 42%, rgba(251,146,60,0.04) 0%, transparent 60%),
      #080808;
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 25%, rgba(0,0,0,0.75) 100%); }

  .canvas { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; align-items: center; padding: 52px 68px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 50px; }
  .ws-logo { display: flex; align-items: center; gap: 9px; }
  .ws-dot { width: 9px; height: 9px; background: #D4AF37; border-radius: 50%; }
  .ws-name { font-size: 14px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; }
  .slide-count { font-size: 13px; color: #444; font-weight: 600; }

  /* Mom quote callout */
  .mom-quote {
    background: #111; border: 1px solid #1E1E1E;
    border-radius: 20px; padding: 22px 30px;
    font-size: 26px; font-style: italic; color: #777;
    text-align: center; margin-bottom: 44px; width: 100%;
    position: relative;
  }
  .mom-quote::before { content: '"'; font-size: 60px; color: #2A2A2A; position: absolute; top: -10px; left: 20px; font-family: Georgia, serif; line-height: 1; }
  .mom-quote-attr { font-size: 14px; color: #444; margin-top: 8px; font-style: normal; }

  /* Phone with scanning */
  .phone-wrap { position: relative; margin-bottom: 44px; }
  .phone-frame {
    width: 290px; height: 360px;
    background: #0e0e0e; border: 2px solid #252525;
    border-radius: 34px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px #2a2a2a;
    position: relative;
  }
  .phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 70px; height: 5px; background: #1e1e1e; border-radius: 3px; z-index: 5; }
  .phone-screen { width: 100%; height: 100%; background: #080808; padding: 28px 18px 18px; display: flex; flex-direction: column; align-items: center; }
  .pscreen-header { font-size: 11px; font-weight: 800; color: #D4AF37; letter-spacing: 2px; margin-bottom: 14px; }
  .viewfinder { width: 210px; height: 175px; border: 2px solid rgba(251,146,60,0.35); border-radius: 10px; position: relative; background: rgba(251,146,60,0.02); margin-bottom: 12px; overflow: hidden; }
  .c { position: absolute; width: 18px; height: 18px; }
  .c.tl { top: -1px; left: -1px; border-top: 3px solid #fb923c; border-left: 3px solid #fb923c; border-radius: 2px 0 0 0; }
  .c.tr { top: -1px; right: -1px; border-top: 3px solid #fb923c; border-right: 3px solid #fb923c; border-radius: 0 2px 0 0; }
  .c.bl { bottom: -1px; left: -1px; border-bottom: 3px solid #fb923c; border-left: 3px solid #fb923c; border-radius: 0 0 0 2px; }
  .c.br { bottom: -1px; right: -1px; border-bottom: 3px solid #fb923c; border-right: 3px solid #fb923c; border-radius: 0 0 2px 0; }
  /* vintage watch in viewfinder */
  .vf-watch { position: absolute; inset: 20px; border-radius: 50%; border: 1px solid rgba(251,146,60,0.15); display: flex; align-items: center; justify-content: center; }
  .vf-watch-face { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #a89040 0%, #4a3810 100%); opacity: 0.5; }
  .scan-bar { position: absolute; left: 8px; right: 8px; height: 2px; background: linear-gradient(90deg, transparent, #fb923c, transparent); box-shadow: 0 0 8px rgba(251,146,60,0.8); top: 55%; }
  /* progress */
  .prog-wrap { width: 100%; }
  .prog-label { font-size: 9px; color: #555; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .prog-label span { color: #fb923c; }
  .prog-track { height: 3px; background: #1E1E1E; border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; width: 82%; background: linear-gradient(90deg, #fb923c, #fbbf24); border-radius: 2px; }
  .pscreen-status { font-size: 10px; color: #fb923c; text-align: center; margin-top: 10px; font-weight: 700; letter-spacing: 1px; }
  .phone-glow { position: absolute; inset: -16px; background: radial-gradient(ellipse, rgba(251,146,60,0.10) 0%, transparent 70%); z-index: -1; }

  /* Text */
  .tension-headline { font-size: 42px; font-weight: 900; color: #fff; line-height: 1.2; text-align: center; margin-bottom: 14px; }
  .tension-headline em { color: #fb923c; font-style: normal; }
  .tension-sub { font-size: 20px; color: #555; text-align: center; }
  .tension-sub strong { color: #D4AF37; font-weight: 700; }

  .bottom-row { margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 32px; height: 5px; border-radius: 3px; background: #1A1A1A; }
  .dot.done { background: rgba(251,146,60,0.4); }
  .dot.active { background: #fb923c; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>

<div class="canvas">
  <div class="top-bar">
    <div class="ws-logo"><div class="ws-dot"></div><div class="ws-name">WATCHSNAP</div></div>
    <div class="slide-count">2 OF 4</div>
  </div>

  <div class="mom-quote">
    "It's worth nothing, honey. Just an old thing."
    <div class="mom-quote-attr">— Mom</div>
  </div>

  <div class="phone-wrap">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="pscreen-header">WATCHSNAP AI</div>
        <div class="viewfinder">
          <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
          <div class="scan-bar"></div>
          <div class="vf-watch"><div class="vf-watch-face"></div></div>
        </div>
        <div class="prog-wrap">
          <div class="prog-label">Identifying vintage timepiece... <span>82%</span></div>
          <div class="prog-track"><div class="prog-fill"></div></div>
        </div>
        <div class="pscreen-status">PROCESSING...</div>
      </div>
    </div>
  </div>

  <div class="tension-headline">
    "I scanned it <em>anyway.</em>"
  </div>
  <div class="tension-sub">
    Results in <strong>under 15 seconds...</strong>
  </div>

  <div class="bottom-row">
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>
</body>
</html>
