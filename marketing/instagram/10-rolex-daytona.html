<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;overflow:hidden;
    background:#050505;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    color:#fff;
    display:flex;flex-direction:column;align-items:center;
    padding:44px 60px;gap:0;
  }
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(201,168,76,0.22) 0%, transparent 55%),
      radial-gradient(ellipse 40% 30% at 0% 80%, rgba(201,168,76,0.04) 0%, transparent 55%),
      #050505;
  }
  /* Racing stripe */
  .stripe{
    position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
    height:2px;
    background:linear-gradient(90deg,transparent,rgba(201,168,76,0.08),rgba(201,168,76,0.15),rgba(201,168,76,0.08),transparent);
  }

  .header{position:relative;z-index:10;width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#A8882F);display:flex;align-items:center;justify-content:center;font-size:22px}
  .logo-text{font-size:26px;font-weight:900}
  .logo-text span{background:linear-gradient(135deg,#C9A84C,#E2C06D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header-right{text-align:right}
  .hr-chip{font-size:12px;font-weight:700;letter-spacing:2px;color:rgba(201,168,76,0.6);border:1px solid rgba(201,168,76,0.2);border-radius:100px;padding:8px 18px;text-transform:uppercase}

  /* Brand hero */
  .brand-hero{position:relative;z-index:10;text-align:center;margin-bottom:16px}
  .bh-brand{
    font-size:90px;font-weight:900;letter-spacing:-4px;
    background:linear-gradient(135deg,#C9A84C 0%,#E2C06D 30%,#fff 50%,#E2C06D 70%,#C9A84C 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:0.95;
  }
  .bh-sub{
    font-size:30px;font-weight:900;letter-spacing:8px;text-transform:uppercase;
    color:rgba(255,255,255,0.6);
    margin-top:6px;
  }

  /* Cosmo Daytona chronograph watch */
  .watch-zone{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .wz-glow{position:absolute;inset:-50px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.22) 0%,transparent 60%)}
  .bezel{
    width:310px;height:310px;border-radius:50%;
    background:conic-gradient(from 0deg,#222,#444,#333,#555,#222,#444,#222);
    padding:10px;
    box-shadow:0 0 80px rgba(201,168,76,0.18),0 30px 80px rgba(0,0,0,0.9);
    position:relative;
  }
  /* Tachymetre bezel text */
  .tach{
    position:absolute;inset:-2px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .tach-text{
    position:absolute;font-size:6px;font-weight:700;color:rgba(255,255,255,0.5);letter-spacing:0.5px;
    top:4px;left:50%;transform:translateX(-50%) rotate(0);
    text-transform:uppercase;white-space:nowrap;
  }
  .face{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(ellipse at 38% 32%,#111,#000);
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .mk{position:absolute;background:rgba(255,255,255,0.5);width:2px;height:10px;top:12px;left:50%;margin-left:-1px;transform-origin:50% 133px}
  .mk.lg{background:#C9A84C;width:3px;height:18px;top:7px}
  /* 3 chronograph subdials */
  .sd{
    position:absolute;width:66px;height:66px;border-radius:50%;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
  }
  .sd-top{top:50%;left:50%;transform:translate(-50%,-165%)}
  .sd-left{top:50%;left:50%;transform:translate(-205%,-50%)}
  .sd-right{top:50%;left:50%;transform:translate(105%,-50%)}
  .sd-inner{font-size:7px;font-weight:800;color:rgba(255,255,255,0.4);text-align:center;line-height:1.3}
  .sd-hnd{position:absolute;bottom:50%;left:50%;width:1.5px;height:24px;margin-left:-0.75px;background:#fff;transform-origin:50% 100%;border-radius:1px}
  .sdh1{transform:rotate(220deg)} .sdh2{transform:rotate(80deg)} .sdh3{transform:rotate(310deg)}
  .sd-c{position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;background:#C9A84C;transform:translate(-50%,-50%)}
  .rolex-crown{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(201,168,76,0.6);font-weight:900;letter-spacing:2px}
  .daytona-txt{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,0.4);white-space:nowrap}
  .hnd{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:2px 2px 0 0}
  .hh{width:6px;height:90px;margin-left:-3px;background:#fff;transform:rotate(-30deg)}
  .hm{width:4px;height:120px;margin-left:-2px;background:#fff;transform:rotate(120deg)}
  .hs{width:2px;height:128px;margin-left:-1px;background:#C9A84C;transform:rotate(210deg)}
  .cdot{position:absolute;top:50%;left:50%;width:11px;height:11px;border-radius:50%;background:#C9A84C;transform:translate(-50%,-50%);z-index:10;box-shadow:0 0 8px rgba(201,168,76,0.9)}
  .crown{position:absolute;right:-24px;top:50%;transform:translateY(-50%);width:22px;height:13px;background:linear-gradient(135deg,#444,#666,#333);border-radius:0 3px 3px 0}

  /* Stats row */
  .stats-row{position:relative;z-index:10;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:18px}
  .stat{background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:16px 18px;text-align:center}
  .st-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(201,168,76,0.45);margin-bottom:6px}
  .st-val{font-size:20px;font-weight:900;color:#fff}
  .st-val.gold{background:linear-gradient(135deg,#C9A84C,#E2C06D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

  .footer{position:relative;z-index:10;width:100%;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,168,76,0.1);padding-top:18px}
  .auth-pill{display:flex;align-items:center;gap:9px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:100px;padding:9px 20px}
  .ap-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
  .ap-text{font-size:14px;font-weight:800;color:#22c55e;letter-spacing:1px;text-transform:uppercase}
  .cta{font-size:17px;font-weight:700;color:rgba(255,255,255,0.4)}
  .cta span{color:#C9A84C;font-weight:900}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stripe"></div>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⌚</div>
    <div class="logo-text">Watch<span>Snap</span></div>
  </div>
  <div class="hr-chip">Chronograph · Ceramic</div>
</div>

<div class="brand-hero">
  <div class="bh-brand">Rolex</div>
  <div class="bh-sub">Daytona</div>
</div>

<div class="watch-zone">
  <div class="wz-glow"></div>
  <div class="bezel">
    <div class="face">
      <div class="mk lg" style="transform:rotate(0deg)"></div>
      <div class="mk" style="transform:rotate(30deg)"></div>
      <div class="mk" style="transform:rotate(60deg)"></div>
      <div class="mk lg" style="transform:rotate(90deg)"></div>
      <div class="mk" style="transform:rotate(120deg)"></div>
      <div class="mk" style="transform:rotate(150deg)"></div>
      <div class="mk lg" style="transform:rotate(180deg)"></div>
      <div class="mk" style="transform:rotate(210deg)"></div>
      <div class="mk" style="transform:rotate(240deg)"></div>
      <div class="mk lg" style="transform:rotate(270deg)"></div>
      <div class="mk" style="transform:rotate(300deg)"></div>
      <div class="mk" style="transform:rotate(330deg)"></div>
      <div class="rolex-crown">♛ ROLEX</div>
      <div class="sd sd-top"><div class="sd-inner">30<br>MIN</div><div class="sd-hnd sdh1"></div><div class="sd-c"></div></div>
      <div class="sd sd-left"><div class="sd-inner">12<br>HR</div><div class="sd-hnd sdh2"></div><div class="sd-c"></div></div>
      <div class="sd sd-right"><div class="sd-inner">60<br>SEC</div><div class="sd-hnd sdh3"></div><div class="sd-c"></div></div>
      <div class="daytona-txt">COSMOGRAPH DAYTONA</div>
      <div class="hnd hh"></div>
      <div class="hnd hm"></div>
      <div class="hnd hs"></div>
      <div class="cdot"></div>
    </div>
  </div>
  <div class="crown"></div>
</div>

<div class="stats-row">
  <div class="stat">
    <div class="st-label">Reference</div>
    <div class="st-val" style="font-size:16px">116500LN</div>
  </div>
  <div class="stat">
    <div class="st-label">Market Value</div>
    <div class="st-val gold">$28,400</div>
  </div>
  <div class="stat">
    <div class="st-label">Confidence</div>
    <div class="st-val gold">96%</div>
  </div>
  <div class="stat">
    <div class="st-label">Year</div>
    <div class="st-val">2021</div>
  </div>
</div>

<div class="footer">
  <div class="auth-pill">
    <div class="ap-dot"></div>
    <div class="ap-text">Authentic · Cal. 4130</div>
  </div>
  <div class="cta">Try free · <span>watchsnap.vercel.app</span></div>
</div>
</body>
</html>
