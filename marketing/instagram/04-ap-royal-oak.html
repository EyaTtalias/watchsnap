<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;overflow:hidden;
    background:#070709;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    color:#fff;
  }
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 75% 50% at 50% 0%, rgba(201,168,76,0.16) 0%, transparent 58%),
      radial-gradient(ellipse 50% 40% at 0% 80%, rgba(60,80,140,0.08) 0%, transparent 55%),
      #070709;
  }
  /* Octagonal mesh */
  .mesh{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px),
      linear-gradient(45deg,rgba(201,168,76,0.02) 1px,transparent 1px);
    background-size:60px 60px,60px 60px,60px 60px;
  }

  .wrap{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;padding:44px 60px;gap:20px}

  .header{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#A8882F);display:flex;align-items:center;justify-content:center;font-size:21px}
  .logo-text{font-size:25px;font-weight:900}
  .logo-text span{background:linear-gradient(135deg,#C9A84C,#E2C06D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .series{font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(201,168,76,0.55);border:1px solid rgba(201,168,76,0.2);border-radius:100px;padding:8px 18px;text-transform:uppercase}

  /* Big centered brand */
  .brand-section{text-align:center;padding:10px 0}
  .brand-label{font-size:12px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:rgba(201,168,76,0.5);margin-bottom:8px}
  .brand-name{
    font-size:52px;font-weight:900;letter-spacing:-1px;
    background:linear-gradient(135deg,#C9A84C,#E2C06D,#C9A84C);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;
  }

  /* Octagon watch */
  .center-art{display:flex;align-items:center;justify-content:center;position:relative;flex:1}
  .oct-glow{
    position:absolute;width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,168,76,0.12) 0%,transparent 60%);
  }
  .octagon{
    position:relative;
    width:280px;height:280px;
    clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
    background:linear-gradient(145deg,#1c2030,#080c18);
    border:2px solid rgba(201,168,76,0.4);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 80px rgba(201,168,76,0.15);
  }
  /* Integrated bracelet lines */
  .oct-detail{
    position:absolute;inset:0;
    clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
    background:repeating-linear-gradient(
      0deg,transparent,transparent 12px,rgba(201,168,76,0.05) 12px,rgba(201,168,76,0.05) 13px
    );
  }
  .oct-face{
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(ellipse at 35% 35%,#1e2440,#05080f);
    border:2px solid rgba(201,168,76,0.3);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .oct-mk{position:absolute;background:rgba(201,168,76,0.6);width:1.5px;height:8px;top:10px;left:50%;margin-left:-0.75px;transform-origin:50% 80px}
  .oct-hand{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:2px 2px 0 0}
  .oh-hr{width:5px;height:55px;margin-left:-2.5px;background:#E2E8F0;transform:rotate(20deg)}
  .oh-mn{width:3px;height:68px;margin-left:-1.5px;background:#E2E8F0;transform:rotate(200deg)}
  .oh-sc{width:2px;height:74px;margin-left:-1px;background:#C9A84C;transform:rotate(320deg)}
  .oct-dot{position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:50%;background:#C9A84C;transform:translate(-50%,-50%);z-index:5}
  .ap-text{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:1.5px;color:rgba(255,255,255,0.45);white-space:nowrap;text-align:center}
  .screws{position:absolute;inset:0;clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)}
  .screw{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,0.3);border:1px solid rgba(201,168,76,0.4)}

  /* Value strip */
  .value-strip{
    background:rgba(201,168,76,0.06);
    border:1px solid rgba(201,168,76,0.2);
    border-radius:20px;
    padding:24px 40px;
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:center;gap:30px;
  }
  .vs-left{}
  .vs-model{font-size:28px;font-weight:900;color:#fff;letter-spacing:-0.5px;margin-bottom:3px}
  .vs-ref{font-size:13px;color:rgba(255,255,255,0.35);letter-spacing:1px}
  .vs-div{width:1px;height:50px;background:rgba(201,168,76,0.2)}
  .vs-right{text-align:right}
  .vs-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,0.5);margin-bottom:6px}
  .vs-value{
    font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;
    background:linear-gradient(135deg,#C9A84C,#E2C06D);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }

  /* Footer */
  .footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,168,76,0.1);padding-top:20px}
  .auth-pill{display:flex;align-items:center;gap:9px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:100px;padding:8px 18px}
  .auth-dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .auth-text{font-size:13px;font-weight:800;color:#22c55e;letter-spacing:1px;text-transform:uppercase}
  .cta{font-size:16px;font-weight:700;color:rgba(255,255,255,0.4)}
  .cta span{color:#C9A84C;font-weight:900}
  .conf{font-size:14px;font-weight:700;color:rgba(201,168,76,0.6)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="mesh"></div>

<div class="wrap">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⌚</div>
      <div class="logo-text">Watch<span>Snap</span></div>
    </div>
    <div class="series">Jumbo · 15202ST</div>
  </div>

  <div class="brand-section">
    <div class="brand-label">AI Identified</div>
    <div class="brand-name">Audemars Piguet</div>
  </div>

  <div class="center-art">
    <div class="oct-glow"></div>
    <div class="octagon">
      <div class="oct-detail"></div>
      <!-- Corner screws -->
      <div class="screw" style="top:12px;left:50%;transform:translateX(-50%)"></div>
      <div class="screw" style="bottom:12px;left:50%;transform:translateX(-50%)"></div>
      <div class="screw" style="left:12px;top:50%;transform:translateY(-50%)"></div>
      <div class="screw" style="right:12px;top:50%;transform:translateY(-50%)"></div>
      <div class="oct-face">
        <div class="oct-mk" style="transform:rotate(0deg)"></div>
        <div class="oct-mk" style="transform:rotate(30deg)"></div>
        <div class="oct-mk" style="transform:rotate(60deg)"></div>
        <div class="oct-mk" style="transform:rotate(90deg)"></div>
        <div class="oct-mk" style="transform:rotate(120deg)"></div>
        <div class="oct-mk" style="transform:rotate(150deg)"></div>
        <div class="oct-mk" style="transform:rotate(180deg)"></div>
        <div class="oct-mk" style="transform:rotate(210deg)"></div>
        <div class="oct-mk" style="transform:rotate(240deg)"></div>
        <div class="oct-mk" style="transform:rotate(270deg)"></div>
        <div class="oct-mk" style="transform:rotate(300deg)"></div>
        <div class="oct-mk" style="transform:rotate(330deg)"></div>
        <div class="oct-hand oh-hr"></div>
        <div class="oct-hand oh-mn"></div>
        <div class="oct-hand oh-sc"></div>
        <div class="oct-dot"></div>
        <div class="ap-text">AUDEMARS PIGUET<br>ROYAL OAK</div>
      </div>
    </div>
  </div>

  <div class="value-strip">
    <div class="vs-left">
      <div class="vs-model">Royal Oak</div>
      <div class="vs-ref">Ref. 15202ST &nbsp;·&nbsp; "Jumbo" Extra-Thin &nbsp;·&nbsp; 2020</div>
    </div>
    <div class="vs-div"></div>
    <div class="vs-right">
      <div class="vs-label">Market Value</div>
      <div class="vs-value">$87,500</div>
    </div>
  </div>

  <div class="footer">
    <div class="auth-pill">
      <div class="auth-dot"></div>
      <div class="auth-text">Authentic · 89% conf.</div>
    </div>
    <div class="cta">Try free · <span>watchsnap.vercel.app</span></div>
  </div>
</div>
</body>
</html>
