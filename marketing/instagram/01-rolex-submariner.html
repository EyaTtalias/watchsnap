<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;overflow:hidden;
    background:#070707;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  }

  /* ── BACKGROUND ── */
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, rgba(201,168,76,0.14) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(0,80,180,0.08) 0%, transparent 60%),
      #070707;
  }
  .grid{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(201,168,76,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.035) 1px, transparent 1px);
    background-size:54px 54px;
  }

  /* ── HEADER ── */
  .header{
    position:relative;z-index:10;
    width:100%;
    display:flex;align-items:center;justify-content:space-between;
    padding:44px 60px 0;
  }
  .logo{display:flex;align-items:center;gap:14px}
  .logo-icon{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#C9A84C,#A8882F);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .logo-text{font-size:26px;font-weight:900;letter-spacing:-0.5px}
  .logo-text span{
    background:linear-gradient(135deg,#C9A84C,#E2C06D);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .badge-auth{
    display:flex;align-items:center;gap:10px;
    background:rgba(34,197,94,0.12);
    border:1.5px solid rgba(34,197,94,0.35);
    border-radius:100px;
    padding:10px 22px;
  }
  .badge-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
  .badge-auth span{font-size:14px;font-weight:800;color:#22c55e;letter-spacing:1.5px;text-transform:uppercase}

  /* ── DIVIDER ── */
  .divider{
    position:relative;z-index:10;
    width:960px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,168,76,0.4),transparent);
  }

  /* ── WATCH FACE ── */
  .watch-wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:0}
  .watch{position:relative;width:240px;height:240px}
  .bezel{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,#5A4010,#C9A84C,#E2C06D,#A8882F,#5A4010,#C9A84C,#E2C06D,#5A4010);
    padding:10px;
  }
  .face{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(ellipse at 38% 30%,#1a2a3a,#050d15 70%);
    position:relative;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .face-inner{position:relative;width:100%;height:100%}
  /* Hour markers */
  .mk{
    position:absolute;background:#C9A84C;
    width:2px;height:12px;border-radius:1px;
    top:14px;left:50%;margin-left:-1px;
    transform-origin:50% calc(96px);
  }
  .mk.lg{width:3px;height:18px;top:10px;background:#E2C06D}
  /* Hands */
  .hand{
    position:absolute;bottom:50%;left:50%;
    transform-origin:50% 100%;
    border-radius:3px 3px 0 0;
  }
  .h-hour{width:5px;height:68px;margin-left:-2.5px;background:#fff;transform:rotate(-30deg)}
  .h-min {width:3px;height:85px;margin-left:-1.5px;background:#fff;transform:rotate(120deg)}
  .h-sec {width:2px;height:90px;margin-left:-1px;background:#C9A84C;transform:rotate(210deg)}
  .center-dot{
    position:absolute;top:50%;left:50%;
    width:10px;height:10px;border-radius:50%;
    background:#C9A84C;transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(201,168,76,0.8);
    z-index:10;
  }
  /* Date window */
  .date-win{
    position:absolute;right:25px;top:50%;transform:translateY(-50%);
    width:22px;height:16px;
    background:#fff;border:1px solid #C9A84C;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;color:#000;
  }
  .crown{
    position:absolute;right:-18px;top:50%;transform:translateY(-50%);
    width:16px;height:10px;background:linear-gradient(135deg,#C9A84C,#A8882F);
    border-radius:0 2px 2px 0;
  }
  .watch-glow{
    position:absolute;inset:-20px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,80,180,0.25) 0%,transparent 65%);
    pointer-events:none;
  }

  /* ── INFO CARD ── */
  .info{
    position:relative;z-index:10;
    width:960px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(201,168,76,0.2);
    border-radius:28px;
    padding:36px 52px;
    display:grid;grid-template-columns:1fr auto;gap:0;
    align-items:center;
    backdrop-filter:blur(20px);
  }
  .brand{
    font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    color:#C9A84C;margin-bottom:6px;
  }
  .model{font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1.1;color:#fff;margin-bottom:4px}
  .ref{font-size:15px;color:rgba(255,255,255,0.4);font-weight:500;letter-spacing:1px}
  .value-block{text-align:right}
  .value-label{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,0.7);margin-bottom:6px}
  .value{
    font-size:44px;font-weight:900;letter-spacing:-1.5px;
    background:linear-gradient(135deg,#C9A84C,#E2C06D);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;
  }
  .value-sub{font-size:13px;color:rgba(255,255,255,0.35);margin-top:4px;font-weight:500}

  /* ── CONFIDENCE ── */
  .conf-row{
    position:relative;z-index:10;
    width:960px;display:flex;align-items:center;gap:20px;
  }
  .conf-label{font-size:12px;font-weight:700;color:rgba(201,168,76,0.6);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
  .conf-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
  .conf-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#C9A84C,#E2C06D);width:97%}
  .conf-pct{font-size:14px;font-weight:900;color:#C9A84C;white-space:nowrap}

  /* ── FOOTER ── */
  .footer{
    position:relative;z-index:10;
    width:100%;
    padding:0 60px 44px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .cta{
    font-size:17px;font-weight:700;color:rgba(255,255,255,0.5);letter-spacing:0.5px;
  }
  .cta span{color:#C9A84C;font-weight:900}
  .tags{display:flex;gap:10px}
  .tag{
    font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:rgba(201,168,76,0.5);
    border:1px solid rgba(201,168,76,0.2);border-radius:100px;
    padding:5px 14px;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⌚</div>
    <div class="logo-text">Watch<span>Snap</span></div>
  </div>
  <div class="badge-auth">
    <div class="badge-dot"></div>
    <span>Authentic</span>
  </div>
</div>

<div class="divider"></div>

<div class="watch-wrap">
  <div class="watch">
    <div class="bezel">
      <div class="face">
        <div class="face-inner">
          <!-- 12 markers -->
          <div class="mk lg" style="transform:rotate(0deg)"></div>
          <div class="mk" style="transform:rotate(30deg)"></div>
          <div class="mk" style="transform:rotate(60deg)"></div>
          <div class="mk lg" style="transform:rotate(90deg)"></div>
          <div class="mk" style="transform:rotate(120deg)"></div>
          <div class="mk" style="transform:rotate(150deg)"></div>
          <div class="mk lg" style="transform:rotate(180deg)"></div>
          <div class="mk" style="transform:rotate(210deg)"></div>
          <div class="mk" style="transform:rotate(240deg)"></div>
          <div class="mk lg" style="transform:rotate(270deg)"></div>
          <div class="mk" style="transform:rotate(300deg)"></div>
          <div class="mk" style="transform:rotate(330deg)"></div>
          <div class="hand h-hour"></div>
          <div class="hand h-min"></div>
          <div class="hand h-sec"></div>
          <div class="center-dot"></div>
          <div class="date-win">24</div>
        </div>
      </div>
    </div>
    <div class="crown"></div>
    <div class="watch-glow"></div>
  </div>
</div>

<div class="info">
  <div>
    <div class="brand">Rolex</div>
    <div class="model">Submariner Date</div>
    <div class="ref">Ref. 16610 &nbsp;·&nbsp; 1993 – 2010 &nbsp;·&nbsp; Cal. 3135</div>
  </div>
  <div class="value-block">
    <div class="value-label">Market Value</div>
    <div class="value">$12,800</div>
    <div class="value-sub">– $15,400 · Chrono24 / eBay</div>
  </div>
</div>

<div class="conf-row">
  <div class="conf-label">AI Confidence</div>
  <div class="conf-bar-wrap"><div class="conf-bar"></div></div>
  <div class="conf-pct">97%</div>
</div>

<div class="footer">
  <div class="cta">Try free at <span>watchsnap.vercel.app</span></div>
  <div class="tags">
    <div class="tag">AI Verified</div>
    <div class="tag">Free Scan</div>
  </div>
</div>
</body>
</html>
